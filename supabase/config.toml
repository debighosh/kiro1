# Supabase local development configuration for MSS LivePulse.
#
# This is a conventional, standard Supabase config.toml with sensible
# local-dev defaults. It defines the project id, the local ports used by
# the Supabase CLI stack (API, DB, Studio, etc.), and auth settings that
# suit an admin-only authentication model (audience users are anonymous
# and never authenticate; see design.md → Architecture: Supabase managed
# services). No secrets are stored here.

# A string used to distinguish different Supabase projects on the same
# host. Defaults to the working directory name when running `supabase init`.
project_id = "mss-livepulse"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in
# this schema will get API endpoints. `public` and `graphql_public` schemas
# are included by default.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returned from a table or view. Limits payload
# size for accidental or malicious requests.
max_rows = 1000

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# The database major version to use. This has to be the same as your remote
# database's. Run `SHOW server_version;` on the remote database to check.
major_version = 15

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"

# Email testing server. Emails sent with the local dev setup are not actually
# sent - rather, they are monitored, and you can view the emails that would
# have been sent from the web interface.
[inbucket]
enabled = true
# Port to use for the email testing server web interface.
port = 54324

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
# Event logo assets are <=2 MB (see design.md events.logo_path).
file_size_limit = "5MiB"

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for
# constructing URLs used in emails.
site_url = "http://127.0.0.1:5173"
# A list of *exact* URLs that auth providers are permitted to redirect to
# post authentication.
additional_redirect_urls = ["http://127.0.0.1:5173"]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour).
jwt_expiry = 3600
# Allow/disallow new user signups to your project.
# Admins are provisioned by an operator, not via open signup (admin-only auth).
enable_signup = false

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = false
# If enabled, a user will be required to confirm any email change on both the
# old, and new email addresses. If disabled, only the new email is required to
# confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
enable_confirmations = false

# Uncomment to configure external auth providers if ever needed.
# Audience users are anonymous and do NOT authenticate; only administrators
# authenticate, so no external OAuth providers are enabled by default.
# [auth.external.github]
# enabled = false

[edge_runtime]
enabled = true
# Configure one of the supported request policies: `oneshot`, `per_worker`.
# Use `oneshot` for hot reload during local development.
policy = "oneshot"
inspector_port = 8083

# Local Edge Functions. Individual function entries are added as the functions
# are created (tasks 7.2 / 7.3).
[functions]

# create-event (task 7.2): authenticated event-create mutation. It performs its
# own admin-JWT verification, so the platform's built-in JWT gate is disabled
# (verify_jwt = false) to allow the function to return its own structured 401.
[functions.create-event]
verify_jwt = false

# transition-event-status (task 7.3): authenticated event-status transition
# mutation (draft → live → ended → archived). Like create-event it performs its
# own admin-JWT verification, so the platform's built-in JWT gate is disabled
# (verify_jwt = false) to allow the function to return its own structured 401.
[functions.transition-event-status]
verify_jwt = false

# moderate-question (task 16.1): authenticated question-moderation mutation
# (approve → approved, feature → featured, answer → answered, hide → hidden).
# Like create-event and transition-event-status it performs its own admin-JWT
# verification, so the platform's built-in JWT gate is disabled
# (verify_jwt = false) to allow the function to return its own structured 401.
[functions.moderate-question]
verify_jwt = false

[analytics]
enabled = false
